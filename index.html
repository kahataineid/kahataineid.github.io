<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عيديتك 🎁</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "PingARLT";
    src: url("fonts/PingAR_LT-Regular.otf") format("opentype");
  }
  @font-face {
    font-family: "PingARBold";
    src: url("fonts/PingAR_LT-Bold.otf") format("opentype");
  }

  :root {
    --green: #046c50;
    --green-dark: #035840;
    --gold: #c9a84c;
    --beige-light: #fffdf8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "PingARLT", 'Tajawal', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image: url('images/waves.png');
    background-size: cover;
    background-position: center;
    overflow-x: hidden;
  }

  .main-wrapper {
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .split-card {
    display: flex;
    flex-direction: row-reverse;
    width: 100%;
    max-width: 900px;
    min-height: 520px;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(4,108,80,0.22);
  }

  /* يسار: معاينة البطاقة */
  .card-image-side {
    flex: 1.2;
    background: #d4ede4;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    position: relative;
    overflow: hidden;
  }
  .card-image-side::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 60% 40%, rgba(201,168,76,0.10) 0%, transparent 70%);
  }
  .card-preview {
    position: relative;
    display: inline-block;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 16px 48px rgba(0,0,0,0.35);
    z-index: 1;
  }
  .greeting-img {
    width: 340px;
    max-width: 90%;
    display: block;
  }
  .employee-name {
    position: absolute;
    left: 55%;
    bottom: 11%;
    transform: translateX(-50%);
    width: 72%;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    line-height: 1;
    font-weight: 700;
    color: white;
    white-space: nowrap;
    font-family: "PingARBold", 'Tajawal', Arial;
  }

  /* يمين: الفورم */
  .card-form-side {
    flex: 1;
    background: var(--beige-light);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 36px;
  }
  .form-inner {
    width: 100%;
    max-width: 300px;
    text-align: center;
  }
  .form-logo { margin-bottom: 24px; }
  .form-logo img { width: 130px; }
  .form-inner h2 {
    font-size: 22px;
    font-weight: 900;
    color: var(--green);
    font-family: "PingARBold", 'Tajawal', Arial;
    margin-bottom: 6px;
  }
  .form-inner > p {
    font-size: 13px;
    color: #7a9e90;
    margin-bottom: 24px;
    font-family: "PingARLT", 'Tajawal', Arial;
  }

  /* اختيار البطاقة */
  .picker-label {
    font-size: 12px;
    color: #7a9e90;
    margin-bottom: 10px;
    font-family: "PingARLT", 'Tajawal', Arial;
    text-align: right;
  }
  .card-picker {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 18px;
    flex-direction: row-reverse;
  }
  .card-thumb {
    flex: 1;
    border: 2.5px solid rgba(4,108,80,0.18);
    border-radius: 10px;
    padding: 6px;
    cursor: pointer;
    transition: border-color 0.25s, box-shadow 0.25s, transform 0.2s;
    background: #fff;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .card-thumb img {
    width: 100%;
    border-radius: 6px;
    display: block;
    aspect-ratio: 1/1;
    object-fit: cover;
  }
  .card-thumb span {
    display: block;
    font-size: 11px;
    color: #7a9e90;
    margin-top: 5px;
    font-family: "PingARLT", 'Tajawal', Arial;
  }
  .card-thumb:hover {
    border-color: var(--green);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(4,108,80,0.18);
  }
  .card-thumb.active {
    border-color: var(--green);
    box-shadow: 0 4px 16px rgba(4,108,80,0.22);
  }
  .card-thumb.active::after {
    content: '✓';
    position: absolute;
    top: 6px;
    left: 6px;
    width: 20px;
    height: 20px;
    background: var(--green);
    color: #fff;
    border-radius: 50%;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 20px;
  }
  .card-thumb.active span {
    color: var(--green);
    font-family: "PingARBold", 'Tajawal', Arial;
  }

  /* حقل الاسم */
  .input-group {
    position: relative;
    margin-bottom: 16px;
  }
  .input-group input {
    width: 100%;
    padding: 14px 44px 14px 16px;
    border-radius: 10px;
    border: 1.5px solid rgba(4,108,80,0.2);
    background: #fff;
    font-size: 14px;
    color: var(--green);
    font-family: "PingARLT", 'Tajawal', Arial;
    text-align: right;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .input-group input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(4,108,80,0.1);
  }
  .input-group input::placeholder { color: #b0cec5; }
  .input-icon {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    color: var(--green);
    opacity: 0.5;
  }

  /* زر التحميل */
  #downloadBtn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--green);
    color: #fff;
    font-size: 15px;
    font-family: "PingARBold", 'Tajawal', Arial;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(4,108,80,0.3);
  }
  #downloadBtn:hover {
    background: var(--green-dark);
    transform: translateY(-1px);
    box-shadow: 0 8px 28px rgba(4,108,80,0.4);
  }
  #downloadBtn:active { transform: scale(0.98); }

  /* رسالة الخطأ */
  #error-msg {
    display: none;
    color: #e05a3a;
    font-size: 13px;
    margin-top: 8px;
    text-align: center;
  }

  .form-inner::after {
    content: '';
    display: block;
    width: 48px;
    height: 3px;
    background: var(--gold);
    border-radius: 3px;
    margin: 20px auto 0;
  }

  /* Overlay التحميل */
  #loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4,108,80,0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  #loading-overlay.show {
    opacity: 1;
    pointer-events: all;
  }
  .spinner {
    width: 56px;
    height: 56px;
    border: 5px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-overlay p {
    color: #fff;
    font-family: "PingARBold", 'Tajawal', Arial;
    font-size: 18px;
  }

  canvas { display: none; }

  @media (max-width: 700px) {
    .split-card { flex-direction: column; border-radius: 16px; }
    .card-image-side { padding: 24px 20px; }
    .greeting-img { width: 260px; }
    .card-form-side { padding: 30px 24px; }
  }
</style>
</head>
<body>

<div class="main-wrapper">
  <div class="split-card">

    <!-- يسار: معاينة البطاقة -->
    <div class="card-image-side">
      <div class="card-preview">
        <img src="images/adha_card.png" class="greeting-img" id="previewImg" alt="بطاقة التهنئة">
        <div class="employee-name" id="employeeName"></div>
      </div>
    </div>

    <!-- يمين: الفورم -->
    <div class="card-form-side">
      <div class="form-inner">
        <div class="form-logo">
          <img src="images/logo.webp" alt="شعار كهاتين">
        </div>
        <h2>أهلاً بك 👋</h2>
        <p>اختر بطاقتك وأدخل اسمك لتحميلها</p>

        <!-- اختيار البطاقة -->
        <p class="picker-label">اختر البطاقة</p>
        <div class="card-picker">
          <div class="card-thumb active" id="thumb1" onclick="selectCard(1)">
            <img src="images/adha_card.png" alt="بطاقة 1">
            <span>بطاقة ١</span>
          </div>
          <div class="card-thumb" id="thumb2" onclick="selectCard(2)">
            <img src="images/new_adha_card.png" alt="بطاقة 2">
            <span>بطاقة ٢</span>
          </div>
        </div>

        <div class="input-group">
          <input type="text" id="nameInput" placeholder="اسمك هنا" maxlength="40">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>

        <button id="downloadBtn" onclick="downloadAndRedirect()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          🎁 فتح عيديتك
        </button>
        <p id="error-msg">الرجاء إدخال اسمك أولاً</p>
      </div>
    </div>

  </div>
</div>

<!-- Overlay أثناء التحميل -->
<div id="loading-overlay">
  <div class="spinner"></div>
  <p>يتم تجهيز عيديتك...</p>
</div>

<canvas id="canvas"></canvas>

<script>
  var cards = {
    1: {
      src: 'images/adha_card.png',
      nameX: 0.50,
      nameY: 0.870,
      fontSize: 19,
      maxWidthRatio: 0.52,
      nameColor: '#ffffff',
      previewTop: '85%',
      previewLeft: '55%'
    },
    2: {
      src: 'images/new_adha_card.png',
      nameX: 0.50,
      nameY: 0.870,
      fontSize: 19,
      maxWidthRatio: 0.52,
      nameColor: '#ffffff',
      previewTop: '85%',
      previewLeft: '55%'
    }
  };

  var selectedCard = 1;

  function selectCard(num) {
    selectedCard = num;
    document.getElementById('previewImg').src = cards[num].src;
    document.getElementById('employeeName').style.top = cards[num].previewTop;
    document.getElementById('employeeName').style.left = cards[num].previewLeft || '55%';
    document.getElementById('thumb1').classList.toggle('active', num === 1);
    document.getElementById('thumb2').classList.toggle('active', num === 2);
  }

  document.getElementById('nameInput').addEventListener('input', function () {
    document.getElementById('employeeName').textContent = this.value;
    document.getElementById('error-msg').style.display = 'none';
  });

  async function downloadAndRedirect() {
    var name = document.getElementById('nameInput').value.trim();
    if (!name) {
      document.getElementById('error-msg').style.display = 'block';
      document.getElementById('nameInput').focus();
      return;
    }

    var img = document.getElementById('previewImg');
    if (!img.complete) { alert('الصورة لم تتحمل بعد'); return; }

    // أظهر الـ overlay
    document.getElementById('loading-overlay').classList.add('show');

    try {
      await document.fonts.load('bold 40px PingARBold');
      await document.fonts.ready;
    } catch(e) {}

    var cfg = cards[selectedCard];
    var canvas = document.getElementById('canvas');
    var nW = img.naturalWidth;
    var nH = img.naturalHeight;
    canvas.width  = nW;
    canvas.height = nH;

    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, nW, nH);

    var RECT_X   = nW * cfg.nameX;
    var RECT_Y   = nH * cfg.nameY;
    var fontSize = Math.round(cfg.fontSize * (nW / 380));
    var maxWidth = nW * cfg.maxWidthRatio;

    ctx.font         = fontSize + 'px PingARBold, Tajawal, Arial, sans-serif';
    ctx.fillStyle    = cfg.nameColor;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(name, RECT_X, RECT_Y, maxWidth);

    // حفظ dataURL في sessionStorage والانتقال للظرف
    var dataURL = canvas.toDataURL('image/png');
    
    try {
      sessionStorage.setItem('eid_card_data', dataURL);
      sessionStorage.setItem('eid_card_name', name);
    } catch(e) {}

    // انتقل مباشرة للظرف
    setTimeout(function() {
      window.location.href = 'envelope.html';
    }, 800);
  }
</script>
</body>
</html>
