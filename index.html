<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عيديتك 🎁</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "PingARLT";
    src: url("fonts/PingAR_LT-Regular.otf") format("opentype");
  }
  @font-face {
    font-family: "PingARBold";
    src: url("fonts/PingAR_LT-Bold.otf") format("opentype");
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: url('images/waves.png') center center / cover no-repeat;
    font-family: "PingARLT", 'Tajawal', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  

  #scene {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .hint-text {
    font-size: 1.3rem;
    color: #046c50;
    font-weight: 700;
    letter-spacing: 1px;
    animation: pulse 2s ease-in-out infinite;
    text-align: center;
    font-family: "PingARBold", 'Tajawal', sans-serif;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.7; transform: scale(1.04); }
  }

  #envelope-wrap {
    position: relative;
    width: 320px;
    height: 220px;
    cursor: pointer;
    animation: shake 3s ease-in-out infinite;
    transform-origin: center bottom;
    filter: drop-shadow(0 12px 40px rgba(4,108,80,0.25));
    transition: filter 0.3s;
  }
  #envelope-wrap:hover { filter: drop-shadow(0 20px 60px rgba(4,108,80,0.42)); }

  @keyframes shake {
    0%, 100% { transform: rotate(0deg); }
    10%       { transform: rotate(-3deg); }
    20%       { transform: rotate(3deg); }
    30%       { transform: rotate(-2deg); }
    40%       { transform: rotate(2deg); }
    50%       { transform: rotate(0deg); }
  }

  #env-svg { width: 100%; height: 100%; position: absolute; inset: 0; }

  #env-flap {
    transform-origin: top center;
    transform-box: fill-box;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #envelope-wrap.opening #env-flap { transform: rotateX(-160deg); }

  #env-bow {
    animation: bowWobble 2s ease-in-out infinite;
    transform-origin: center;
    transform-box: fill-box;
  }
  @keyframes bowWobble {
    0%, 100% { transform: scale(1) rotate(0deg); }
    25%       { transform: scale(1.1) rotate(-5deg); }
    75%       { transform: scale(1.1) rotate(5deg); }
  }

  .glitter {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: glitterFly 1.2s ease-out forwards;
    z-index: 20;
  }
  @keyframes glitterFly {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  .confetti {
    position: fixed;
    pointer-events: none;
    animation: confettiFall 2s ease-in forwards;
    z-index: 100;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  #card {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s;
  }
  #card.show { opacity: 1; pointer-events: all; }
  #card img {
    max-width: 88vw;
    max-height: 68vh;
    border-radius: 16px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    transform: scale(0.6) rotate(-4deg);
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #card.show img { transform: scale(1) rotate(0deg); }

  #claim-btn {
    display: block;
    margin: 20px auto 0;
    background: linear-gradient(135deg, #c9a84c, #046c50);
    color: white;
    font-family: "PingARBold", 'Tajawal', sans-serif;
    font-size: 1.2rem;
    font-weight: 900;
    padding: 16px 48px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(4,108,80,0.4);
    transform: scale(0.8);
    opacity: 0;
    transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.4s, opacity 0.4s ease 0.4s, box-shadow 0.2s;
    letter-spacing: 1px;
  }
  #card.show #claim-btn { transform: scale(1); opacity: 1; }
  #claim-btn:hover { box-shadow: 0 12px 40px rgba(4,108,80,0.6); transform: scale(1.05) !important; }
  #card-inner { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>

<div id="scene">
  <p class="hint-text">شيء أُعِدَّ لك</p>
  <div id="envelope-wrap" onclick="openEnvelope()">
    <svg id="env-svg" viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="40" width="312" height="176" rx="10" fill="#f0faf5" stroke="#046c50" stroke-width="2.5"/>
      <line x1="4" y1="216" x2="160" y2="130" stroke="#9fcfbe" stroke-width="1.5" opacity="0.6"/>
      <line x1="316" y1="216" x2="160" y2="130" stroke="#9fcfbe" stroke-width="1.5" opacity="0.6"/>
      <line x1="4" y1="40" x2="160" y2="130" stroke="#9fcfbe" stroke-width="1.5" opacity="0.5"/>
      <line x1="316" y1="40" x2="160" y2="130" stroke="#9fcfbe" stroke-width="1.5" opacity="0.5"/>
      <rect x="12" y="48" width="296" height="160" rx="6" fill="none" stroke="#046c50" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.4"/>
      <g id="env-flap">
        <path d="M4,40 L160,138 L316,40 Z" fill="#d4ede4" stroke="#046c50" stroke-width="2"/>
      </g>
      <g id="env-bow" transform="translate(145, 112)">
        <ellipse cx="-14" cy="-6" rx="14" ry="9" fill="none" stroke="#c9a84c" stroke-width="2.5" transform="rotate(-20,-14,-6)"/>
        <ellipse cx="14" cy="-6" rx="14" ry="9" fill="none" stroke="#c9a84c" stroke-width="2.5" transform="rotate(20,14,-6)"/>
        <circle cx="0" cy="0" r="5" fill="#f0faf5" stroke="#c9a84c" stroke-width="2"/>
        <path d="M-4,4 Q-10,24 -14,30" fill="none" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
        <path d="M4,4 Q10,24 14,30" fill="none" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
      </g>
    </svg>
  </div>
  <p style="color:#046c50; font-size:0.9rem; font-family:'PingARLT','Tajawal',sans-serif; margin-top:4px; opacity:0.8;">انقر على الظرف لفتح عيديتك</p>
</div>

<div id="card">
  <div id="card-inner">
    <img src="images/new_eid_card.png" alt="عيد سعيد"/>
    <button id="claim-btn" onclick="goToNext()">قم باستلام عيديتك</button>
  </div>
</div>

<script>
  function playPop() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(600, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.4, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      osc.start(); osc.stop(ctx.currentTime + 0.3);
      setTimeout(() => {
        const o2 = ctx.createOscillator(), g2 = ctx.createGain();
        o2.type = 'triangle';
        o2.connect(g2); g2.connect(ctx.destination);
        o2.frequency.setValueAtTime(1200, ctx.currentTime);
        o2.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.2);
        g2.gain.setValueAtTime(0.2, ctx.currentTime);
        g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
        o2.start(); o2.stop(ctx.currentTime + 0.25);
      }, 150);
    } catch(e) {}
  }

  function spawnGlitter(x, y) {
    const colors = ['#c9a84c','#046c50','#f5d998','#9fcfbe','#035840','#e8c97a'];
    for (let i = 0; i < 30; i++) {
      const g = document.createElement('div');
      g.className = 'glitter';
      const size = 4 + Math.random() * 8;
      g.style.cssText = `width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};left:${x}px;top:${y}px;--dx:${(Math.random()-0.5)*200}px;--dy:${(Math.random()-0.5)*200}px;`;
      document.body.appendChild(g);
      setTimeout(() => g.remove(), 1300);
    }
  }

  function launchConfetti() {
    const colors = ['#c9a84c','#046c50','#f5d998','#9fcfbe','#035840','#d4ede4','#e8c97a'];
    for (let i = 0; i < 80; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.cssText = `left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};border-radius:${Math.random()>0.5?'50%':'2px'};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;animation-delay:${Math.random()*0.8}s;animation-duration:${1.5+Math.random()*1.5}s;`;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3000);
    }
  }

  let opened = false;
  function openEnvelope() {
    if (opened) return;
    opened = true;
    const wrap = document.getElementById('envelope-wrap');
    const rect = wrap.getBoundingClientRect();
    wrap.style.animation = 'none';
    wrap.classList.add('opening');
    playPop();
    spawnGlitter(rect.left + rect.width/2, rect.top + rect.height/2);
    setTimeout(() => {
      launchConfetti();
      setTimeout(() => document.getElementById('card').classList.add('show'), 400);
    }, 600);
  }

  function goToNext() { window.location.href = 'main.html'; }
</script>
</body>
</html>
